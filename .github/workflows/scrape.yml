name: Auto Update Configs Sublink

on:
  schedule:
    - cron: '0 * * * *' # هر یک ساعت یک‌بار خودکار اجرا می‌شود
  workflow_dispatch: # به شما اجازه می‌دهد خودتان هم دستی آن را اجرا کنید

permissions:
  contents: write

jobs:
  refresh-configs:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install Dependencies
      run: pip install requests

    - name: Run Scraper Script
      run: python scraper.py

    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add ss_turkey_443.txt all_configs.txt
        git diff-index --quiet HEAD || git commit -m "تغییرات جدید کانفیگ‌ها" -a
        git push
